# Run test matrix on Pull Requests
#
# ==============================================================================
#
# These jobs replace the checks that ran under GitLab CI before it was
# dropped: the Python unit tests for the Sphinx conf helpers and a full
# HTML build of the documentation, plus the standard SIMP RELENG checks.
#
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
#

name: PR Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  releng-checks:
    name: 'RELENG checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby 4.0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - name: 'Tags and changelogs'
        # NOTE: `pkg:compare_latest_tag` is intentionally not run here.  This
        # repo's version comes from simp-core's simp.spec (via `munge:prep`),
        # so that check can only pass when simp-core has bumped its version,
        # not on every PR.
        run: |
          bundle exec rake pkg:check_version
          bundle exec rake pkg:create_tag_changelog

  python-tests:
    name: 'Python unit tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - run: pytest -x --capture=no docs/conflib/get_simp_version_test.py

  build-html-docs:
    name: 'Build HTML docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: sphinx-build -n -b html -d sphinx_cache docs html

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - releng-checks
      - python-tests
      - build-html-docs
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
